<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple HTML Project - Git Workflow Demo</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 3rem auto; line-height: 1.6; }
    .btn { background: #0ea5e9; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; cursor: pointer; }
    .btn:hover { background: #0284c7; }
    ul { margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Simple HTML Project</h1>
  <!-- Modified paragraph content -->
  <p id="description">
    This enhanced version demonstrates continuous iteration, clean branching with Git, and seamless collaboration on GitHub.
  </p>

  <!-- Second HTML element: interactive button and list -->
  <button class="btn" onclick="alert('Git workflow demonstration in action!')">
    Click for Details
  </button>

  <ul>
    <li>Branch: <code>feature/update-content</code></li>
    <li>Status: Content updated and secondary elements added</li>
  </ul>
</body>
</html>
